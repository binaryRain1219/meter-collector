spring.application.name=meter-collector
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3307/meter
spring.datasource.username=meter
spring.datasource.password=meter

# MQTT. meter-publisher 의 mqtt.topic-pattern(meter/{deviceCode}/energy) 을 와일드카드로 구독한다
mqtt.broker-url=tcp://localhost:1883
mqtt.client-id=meter-collector-001
mqtt.topic-filter=meter/+/energy
mqtt.qos=1
# false 면 브로커가 구독을 기억해 두었다가, collector 가 내려가 있던 동안의 QoS 1 메시지를 재접속 후 보내준다
mqtt.clean-session=false
# 브로커 인증을 켠 경우에만 설정 (EC2 등)
#mqtt.username=
#mqtt.password=

# 테스트에서는 둘 다 끈다 (src/test/resources/config/application.properties)
mqtt.subscriber.enabled=true
meter.scheduler.enabled=true
