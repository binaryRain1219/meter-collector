<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"/>
    <title th:text="${view.device.name} + ' · 전력 사용'">장비 상세</title>
</head>
<body>
<header>
    <h1 th:text="${view.device.name}">공조기 1호</h1>
    <span class="meta" th:text="${view.device.deviceCode} + ' · ' + ${view.device.category} + (${view.device.isMain} ? ' · 메인 계량기' : '')">AHU-01</span>
    <a th:href="@{/}" style="margin-left:auto">← 대시보드</a>
</header>
<main>

    <div class="toolbar">
        <a th:href="@{/devices/{code}(code=${view.device.deviceCode}, date=${view.previousDate}, unit=${view.unit.code()})}">← 전날</a>
        <form method="get" th:action="@{/devices/{code}(code=${view.device.deviceCode})}">
            <input type="date" name="date" th:value="${view.date}" onchange="this.form.submit()">
            <input type="hidden" name="unit" th:value="${view.unit.code()}">
        </form>
        <a th:if="${view.nextDate != null}"
           th:href="@{/devices/{code}(code=${view.device.deviceCode}, date=${view.nextDate}, unit=${view.unit.code()})}">다음날 →</a>
        <span class="segmented" style="margin-left:auto">
            <a th:each="u : ${T(com.ms.metercollector.dashboard.StatUnit).values()}"
               th:href="@{/devices/{code}(code=${view.device.deviceCode}, date=${view.date}, unit=${u.code()})}"
               th:classappend="${u == view.unit} ? 'active'"
               th:text="${u.label()}">15분</a>
        </span>
    </div>

    <div class="tiles">
        <div class="card tile">
            <div class="label">사용량</div>
            <div class="value"><span th:text="${@fmt.kwh(view.day?.usageKwh)}">0</span><span class="unit">kWh</span></div>
            <div class="sub" th:text="${view.date}">날짜</div>
        </div>
        <div class="card tile">
            <div class="label">평균전력</div>
            <div class="value"><span th:text="${@fmt.kw(view.day?.avgKw)}">0</span><span class="unit">kW</span></div>
            <div class="sub" th:text="'최소 ' + ${@fmt.kw(view.day?.minKw)} + ' · 최대 ' + ${@fmt.kw(view.day?.maxKw)} + ' kW'">-</div>
        </div>
        <div class="card tile">
            <div class="label">최대수요전력</div>
            <div class="value"><span th:text="${@fmt.kw(view.day?.peakDemandKw)}">0</span><span class="unit">kW</span></div>
            <div class="sub" th:text="${view.day?.peakDemandAt != null} ? ${@fmt.time(view.day.peakDemandAt)} + ' 시작 15분 평균' : '-'">-</div>
        </div>
        <div class="card tile">
            <div class="label">데이터 품질</div>
            <div class="value" style="font-size:20px"><span th:replace="~{fragments/common :: quality(${view.day})}">정상</span></div>
            <div class="sub" th:text="${view.day != null} ? '표본 ' + ${view.day.sampleCount} + ' / ' + ${view.day.expectedCount} : '-'">-</div>
        </div>
    </div>

    <h2 th:text="${view.unit.label()} + ' 사용량'">15분 사용량</h2>
    <div class="card">
        <div class="chart"><canvas id="periodChart" aria-label="구간별 사용량 그래프"></canvas></div>
    </div>

    <h2>최근 30일 일 사용량</h2>
    <div class="card">
        <div class="chart small"><canvas id="dailyChart" aria-label="최근 30일 일 사용량 그래프"></canvas></div>
    </div>

    <h2 th:text="${view.unit.label()} + ' 통계'">15분 통계</h2>
    <p class="muted">품질이 정상이 아닌 구간은 배경으로 표시합니다. 사용량은 구간 끝 누적값 − 시작 누적값입니다.</p>
    <div class="card table-wrap">
        <table>
            <thead>
            <tr>
                <th>구간</th>
                <th class="num">사용량 (kWh)</th>
                <th class="num">평균 (kW)</th>
                <th class="num">최대 (kW)</th>
                <th class="num">최소 (kW)</th>
                <th class="num" th:if="${view.unit.name() == 'H1'}">최대수요 (kW)</th>
                <th class="num">표본</th>
                <th>품질</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${view.periods}"
                th:classappend="${p.stat != null and p.stat.quality().name() != 'OK'} ? 'alert'">
                <td th:text="${@fmt.time(p.periodStart)} + ' ~ ' + ${@fmt.time(p.periodEnd)}">14:15 ~ 14:30</td>
                <td class="num" th:text="${@fmt.kwh(p.stat?.usageKwh)}">-</td>
                <td class="num" th:text="${@fmt.kw(p.stat?.avgKw)}">-</td>
                <td class="num" th:text="${@fmt.kw(p.stat?.maxKw)}">-</td>
                <td class="num" th:text="${@fmt.kw(p.stat?.minKw)}">-</td>
                <td class="num" th:if="${view.unit.name() == 'H1'}" th:text="${@fmt.kw(p.stat?.peakDemandKw)}">-</td>
                <td class="num" th:text="${p.stat != null} ? ${p.stat.sampleCount} + ' / ' + ${p.stat.expectedCount} : '-'">-</td>
                <td><span th:replace="~{fragments/common :: quality(${p.stat})}">정상</span></td>
            </tr>
            </tbody>
        </table>
    </div>

</main>
<script th:inline="javascript">
    const chart = JSON.parse(/*[[${chartJson}]]*/ '{}');
    barChart(document.getElementById('periodChart'), chart.periodLabels, chart.periodUsage, '사용량', 'kWh');
    barChart(document.getElementById('dailyChart'), chart.dailyLabels.map(d => d.substring(5)), chart.dailyUsage, '사용량', 'kWh');
</script>
</body>
</html>
