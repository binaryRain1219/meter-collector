<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"/>
    <title>전력 사용 대시보드</title>
</head>
<body>
<header>
    <h1>전력 사용 대시보드</h1>
    <span class="meta" th:text="${#temporals.format(view.now, 'yyyy-MM-dd HH:mm')} + ' 기준 · 통계는 15분마다 갱신'">기준 시각</span>
</header>
<main>

    <section th:each="b : ${view.buildings}">
        <h2>
            <span th:text="${b.building.name}">본관 A동</span>
            <span class="muted" th:text="'오늘 · 계약전력 ' + ${@fmt.kw(b.building.contractKw)} + ' kW'">오늘</span>
        </h2>
        <p class="muted" th:if="${b.mainDevice == null}">메인 계량기가 등록되지 않아 건물 요약을 낼 수 없습니다.</p>
        <div class="tiles" th:if="${b.mainDevice != null}">
            <div class="card tile">
                <div class="label">오늘 사용량</div>
                <div class="value"><span th:text="${@fmt.kwh(b.today?.usageKwh)}">0</span><span class="unit">kWh</span></div>
                <div class="sub" th:text="${b.mainDevice.name} + ' 기준'">메인 계량기 기준</div>
            </div>
            <div class="card tile">
                <div class="label">현재 전력</div>
                <div class="value"><span th:text="${@fmt.kw(b.currentKw)}">0</span><span class="unit">kW</span></div>
                <div class="sub">가장 최근 순시전력</div>
            </div>
            <div class="card tile">
                <div class="label">오늘 최대수요전력</div>
                <div class="value"><span th:text="${@fmt.kw(b.today?.peakDemandKw)}">0</span><span class="unit">kW</span></div>
                <div class="sub" th:text="${b.today?.peakDemandAt != null} ? ${@fmt.time(b.today.peakDemandAt)} + ' 시작 15분 평균' : '-'">-</div>
            </div>
            <div class="card tile">
                <div class="label">계약전력 대비</div>
                <div class="value"><span th:text="${@fmt.percent(b.peakRatio)}">0</span><span class="unit">%</span></div>
                <div class="sub">최대수요전력 / 계약전력</div>
            </div>
        </div>
    </section>

    <h2>장비 현재 상태</h2>
    <div class="card table-wrap">
        <table>
            <thead>
            <tr>
                <th>코드</th>
                <th>이름</th>
                <th>종류</th>
                <th>메인 계량기</th>
                <th>상태</th>
                <th>최근 측정</th>
                <th class="num">순시전력 (kW)</th>
                <th class="num">누적사용량 (kWh)</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${view.devices}" th:classappend="${row.state.name() != 'NORMAL'} ? 'alert'">
                <td><a th:href="@{/devices/{code}(code=${row.device.deviceCode})}" th:text="${row.device.deviceCode}">AHU-01</a></td>
                <td th:text="${row.device.name}">공조기 1호</td>
                <td th:text="${row.device.category}">공조</td>
                <td th:text="${row.device.isMain} ? '예' : '아니오'">아니오</td>
                <td><span th:replace="~{fragments/common :: deviceState(${row.state})}">정상</span></td>
                <td th:text="${@fmt.dateTime(row.latest?.measuredAt)}">-</td>
                <td class="num" th:text="${@fmt.kw(row.latest?.instantKw)}">-</td>
                <td class="num" th:text="${@fmt.kwh(row.latest?.cumulativeKwh)}">-</td>
            </tr>
            </tbody>
        </table>
    </div>

    <h2>오늘 15분 평균전력</h2>
    <div class="card">
        <div class="chart"><canvas id="todayChart" aria-label="장비별 오늘 15분 평균전력 그래프"></canvas></div>
    </div>

</main>
<script th:inline="javascript">
    const chart = JSON.parse(/*[[${chartJson}]]*/ '{"labels":[],"series":[]}');
    lineChart(document.getElementById('todayChart'), chart.labels, chart.series, 'kW');
</script>
</body>
</html>
