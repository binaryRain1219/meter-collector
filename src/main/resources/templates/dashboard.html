<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>전력 사용 대시보드</title>
</head>
<body>
<h1>전력 사용 대시보드</h1>

<h2>연결된 장비</h2>
<table>
    <thead>
    <tr>
        <th>코드</th>
        <th>이름</th>
        <th>종류</th>
        <th>메인 계량기</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="device : ${devices}">
        <td th:text="${device.deviceCode}">AHU-01</td>
        <td th:text="${device.name}">공조기 1호</td>
        <td th:text="${device.category}">공조</td>
        <td th:text="${device.isMain} ? '예' : '아니오'">아니오</td>
    </tr>
    </tbody>
</table>
</body>
</html>
